name: Research checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.21"
      - run: uv sync --locked --extra dev --python 3.11
      - run: uv run --locked ruff check src/toxtransformer_research tests
      - run: uv run --locked pytest -q
      - run: uv run --locked python -m toxtransformer_research.reproduce
      - run: uv run --locked toxtransformer train --data examples/toy.csv --config configs/smoke.json --output runs/ci
      - run: uv run --locked toxtransformer evaluate --run runs/ci --data examples/toy.csv --output runs/ci/test.json
      - run: uv run --locked toxtransformer predict --run runs/ci --smiles CCO --property-id toy_oxygen
